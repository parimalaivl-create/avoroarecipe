name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly regression at 02:00 UTC — the public sandbox resets often.
    - cron: "0 2 * * *"

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PETSTORE_API_URL: https://petstore.swagger.io/v2
  BASE_URL: http://localhost:8080

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Typecheck app and tests
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx tsc --noEmit -p tests/tsconfig.json

  api-tests:
    name: API tests (no browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run Petstore contract tests
        run: npx playwright test --project=api
        env:
          SKIP_WEB_SERVER: "1"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: api-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui-tests:
    name: UI tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: api-tests
    strategy:
      fail-fast: false
      matrix:
        project: [proxy, ui-chromium, ui-mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build the app
        run: npm run build
      - name: Run ${{ matrix.project }}
        # playwright.config.ts starts the dev server on BASE_URL for us.
        run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.project }}-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  summary:
    name: Publish test summary
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Write job summary
        run: |
          {
            echo "## Playwright results"
            echo ""
            echo "| Suite | JUnit report |"
            echo "| --- | --- |"
            for f in $(find reports -name junit.xml | sort); do
              suite=$(basename "$(dirname "$(dirname "$f")")")
              total=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
              failures=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | tr -dc '0-9')
              echo "| $suite | ${total:-0} tests, ${failures:-0} failures |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
